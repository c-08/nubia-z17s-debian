# Device-tree aliases otherwise let udev probe the machine card before QDSP6.
blacklist snd_soc_msm8998
blacklist snd_soc_wcd9335
blacklist snd_soc_tas2555
blacklist slim_qcom_ngd_ctrl
# NGD must be registered before ADSP starts. Explicit modprobe from the audio
# service still works; this only prevents device-tree alias autoload by udev.
blacklist qcom_q6v5_pas
