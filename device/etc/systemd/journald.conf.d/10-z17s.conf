# Z17S: 让系统日志在"长按电源强断电"后尽量少丢
#
# 背景：09-21 那次 RCU stall 后强断电，journald 里一条卡死信息都没有
#       （整机停摆时用户态不被调度，这靠配置救不了 —— 要靠
#        z17s-logwatch 的 0.25s 落盘 + PC 侧串口持续录）。
#       但默认的 SyncIntervalSec=300s 会让"崩溃前几分钟"也一起丢，这里收紧。
#
# 关键改动：
#   SyncIntervalSec 300s -> 5s    强断电最多丢 5 秒，代价是每 5s 一次 fsync
#   SystemMaxUse    4.5G -> 1G    够存很多轮开机，别把 45G 根分区吃光
#   RateLimit*      默认严重限流 -> 放宽，崩溃风暴时不再静默丢消息
#
# 不动的项：ForwardToConsole/ForwardToKMsg 保持 no（内核消息本来就来自 kmsg）
#           MaxLevelKmsg 保持默认 6 —— 不写死参数名，避免 journald 报未知键

[Journal]
Storage=persistent
SyncIntervalSec=5s
SystemMaxUse=1G
SystemMaxFileSize=64M
SystemKeepFree=2G
RateLimitIntervalSec=30s
RateLimitBurst=100000
MaxLevelStore=debug
