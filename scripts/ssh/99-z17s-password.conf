# Z17S: 允许 root 用密码登录
#
# 背景：本机 root / z17s 的密码原本都是「锁定」状态（passwd -S 显示 L），
# 而 OpenSSH 默认 PermitRootLogin=prohibit-password（只允许密钥），
# 所以密码登录一直是失效的。这个 drop-in 把 root 的密码登录打开。
#
# 生效后仍需给账号设密码：passwd root
#
# ★ 本机已决定长期保持开放（2026-10-29），这不是临时措施。
#   理由：出门在外只有蜂窝时，密码登录是唯一还能进机器的路；
#   只留密钥的话密钥文件一丢就彻底进不去。
#
# 仅在「临时把机器接到不可信网络」时才收紧（记得备份再删，事后放回）：
#   cp /etc/ssh/sshd_config.d/99-z17s-password.conf /root/99-z17s-password.conf.bak
#   rm /etc/ssh/sshd_config.d/99-z17s-password.conf
#   sshd -t && systemctl reload ssh
PermitRootLogin yes
PasswordAuthentication yes
