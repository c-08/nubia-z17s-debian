# Z17S: use the WCN3990's hardware crypto (hwcrypto 1).
#
# Do NOT add `cryptmode=1` here unless you also carry the W1 raw-mode patches.
# `cryptmode > 0` requires ATH10K_FW_FEATURE_RAW_MODE_SUPPORT, which the
# HL1.0-01352 firmware on this device does not advertise, so probe fails with
#     ath10k_snoc: cryptmode > 0 requires raw mode support from firmware
#     ath10k_snoc: could not probe fw (-22)
# and wlan0 never appears at all.
#
# Hardware crypto works fine: htt-ver 3.50 ... hwcrypto 1, 866.7 Mbit VHT-MCS9.
# The "high throughput hangs the machine" bug was never a crypto problem --
# see docs/WiFi-A-MSDU修复.md.
